- region "ファイルエディタ":
  - text: ファイル · 1 件 · 操作検証プロジェクト / notes.txt
  - button "分割なし" [pressed]
  - button "左右に分割"
  - button "上下に分割"
  - button "自由に配置"
  - group: キー操作
  - button "タスクに戻る"
