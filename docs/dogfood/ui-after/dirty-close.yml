        - listitem "check、テキスト":  check
    - text: 保存すると、次の指示で手動変更をAIに伝えます。テストがあれば裏取りも走ります。
- complementary "ファイルと並べるチャット":
  - separator "チャットの幅"
  - text: チャット
  - combobox "チャットのタスク":
    - option "操作検証プロジェクト / メモを読み、探して編集する" [selected]
  - region "タスク詳細":
    - text: 操作検証プロジェクト 停止
    - button "削除"
    - text: メモを読み、探して編集する 許可方針
