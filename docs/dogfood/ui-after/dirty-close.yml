      - option "編集は自動"
      - option "毎回確認" [selected]
      - option "おまかせ"
      - option "全自動"
    - text: 操作検証用 0往復 · 0操作
    - button "変更されたファイル 0 差分を見る"
    - text: 経過（クリックで詳細）
    - textbox "このセッションは再開できません" [disabled]
    - button "再開して送信" [disabled]
    - button "📎 ファイルを添える" [disabled]
