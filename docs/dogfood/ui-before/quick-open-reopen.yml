      - option "編集は自動"
      - option "毎回確認" [selected]
      - option "おまかせ"
      - option "全自動"
    - text: 操作検証用 0往復 · 0操作
    - button "変更されたファイル 0 差分を見る"
    - text: 経過（クリックで詳細）
    - textbox "このセッションは再開できません" [disabled]
    - button "再開して送信" [disabled]
    - button "📎 ファイルを添える" [disabled]
- dialog "新しいタスク":
  - text: プロジェクトを選択
  - textbox "プロジェクトを検索":
    - /placeholder: 名前・パスで検索
  - button "操作検証プロジェクト C:/tower-ux-sandbox" [pressed]
  - button "操作検証プロジェクト のサブフォルダを開く": ›
  - text: 選択した作業フォルダ
  - textbox "選択した作業フォルダ":
    - /placeholder: フォルダのパスを直接指定
    - text: C:/tower-ux-sandbox
  - button "このパスの中を参照"
  - heading "新しいタスクを任せる" [level=2]
  - button "閉じる (Esc)"
  - button "Claude Code"
  - button "Codex (OpenAI)"
  - text: 許可・質問・報告のすべてに対応
  - 'textbox "何をしてほしいか、話すように書いてください。 例: ログイン画面で空欄のまま送信できてしまうのを直して。直したらテストも通して。 画面の写真や資料は、貼り付け（Ctrl+V）かここへドラッグすると添えられます。"':
    - /placeholder: "何をしてほしいか、話すように書いてください。\n例: ログイン画面で空欄のまま送信できてしまうのを直して。直したらテストも通して。\n\n画面の写真や資料は、貼り付け（Ctrl+V）かここへドラッグすると添えられます。"
    - text: n-check
  - text: モデル
  - combobox "モデル":
    - option "既定（設定のモデル）" [selected]
    - option "Fable 5.1（最高性能）"
    - option "Opus 5"
    - option "Sonnet 5"
    - option "Haiku 4.5（速い・軽い）"
  - text: 許可
  - combobox "許可":
    - option "編集は自動" [selected]
    - option "毎回確認"
    - option "おまかせ"
    - option "全自動"
  - text: ファイルの編集は自動で進める。コマンド実行だけ確認する
  - checkbox "複数のモデルで比べる"
  - text: 複数のモデルで比べる
  - checkbox "別の作業場所で動かす"
  - text: 別の作業場所で動かす 元のフォルダを触らず、コピー（git worktree）で作業します。終わったら「取り込む」で元のプロジェクトに反映します
  - button "📎 ファイルを添える"
  - text: Ctrl+Enter で起動
  - button "起動"
